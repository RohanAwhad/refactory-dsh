<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="360" viewBox="0 0 1120 360" role="img" aria-labelledby="title desc">
  <title id="title">Two outputs, one explicit workflow system</title>
  <desc id="desc">Create and Edit produce reusable modes that can be run, optimized, audited and adopted. Design produces checked artifacts. The terminal and GUI provide conversation and steering over the graph runtime.</desc>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8" fill="#64748b"/></marker></defs>
  <rect x="1" y="1" width="1118" height="358" rx="18" fill="#f6f9fd" stroke="#d6e1ee"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" fill="#172b46">
    <text x="32" y="42" font-size="16" font-weight="700">YOU STAY IN CONTROL</text>
    <text x="32" y="69" font-size="16" fill="#435875">Terminal or GUI → conversation, steering and approval gates → graph runtime</text>
    <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#arrow)">
      <path d="M233 143 H282"/><path d="M478 143 H530"/><path d="M686 143 H733"/><path d="M904 143 H949"/>
      <path d="M233 264 H282"/>
      <path d="M1027 177 V207 H609 V177"/>
    </g>
    <rect x="32" y="108" width="200" height="69" rx="12" fill="#e5edff" stroke="#9fb9eb"/>
    <text x="132" y="138" text-anchor="middle" font-size="20" font-weight="600">Create / Edit</text>
    <text x="132" y="162" text-anchor="middle" font-size="14">author a harness</text>
    <rect x="285" y="108" width="193" height="69" rx="12" fill="#e5edff" stroke="#9fb9eb"/>
    <text x="381" y="138" text-anchor="middle" font-size="20" font-weight="600">Reusable mode</text>
    <text x="381" y="162" text-anchor="middle" font-size="14">graph + knobs + contracts</text>
    <rect x="533" y="108" width="153" height="69" rx="12" fill="#ddf3ec" stroke="#87beab"/>
    <text x="609" y="139" text-anchor="middle" font-size="20" font-weight="600">Run</text>
    <text x="609" y="162" text-anchor="middle" font-size="14">inspect + steer</text>
    <rect x="736" y="108" width="168" height="69" rx="12" fill="#e5edff" stroke="#9fb9eb"/>
    <text x="820" y="139" text-anchor="middle" font-size="20" font-weight="600">Optimize</text>
    <text x="820" y="162" text-anchor="middle" font-size="14">compare + audit</text>
    <rect x="952" y="108" width="136" height="69" rx="12" fill="#fff0d5" stroke="#d6b46e"/>
    <text x="1020" y="150" text-anchor="middle" font-size="20" font-weight="600">Adopt</text>
    <rect x="32" y="230" width="200" height="69" rx="12" fill="#eee8ff" stroke="#baa8e3"/>
    <text x="132" y="272" text-anchor="middle" font-size="20" font-weight="600">Design</text>
    <rect x="285" y="230" width="193" height="69" rx="12" fill="#eee8ff" stroke="#baa8e3"/>
    <text x="381" y="261" text-anchor="middle" font-size="20" font-weight="600">Checked artifact</text>
    <text x="381" y="285" text-anchor="middle" font-size="14">software, files or reports</text>
    <text x="532" y="265" font-size="16" fill="#435875">Design delivers the artifact itself.</text>
    <text x="532" y="291" font-size="16" fill="#435875">Optimization searches scored, reusable modes.</text>
    <text x="32" y="334" font-size="14" fill="#526681">Checks establish their declared requirements; a successful run does not guarantee perfect generated content.</text>
  </g>
</svg>
