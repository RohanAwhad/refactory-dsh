[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactory-dsh"
version = "0.1.0"
description = "refactory's graph semantics -> graph.json -> DSH executes (create / optimize / design meta-modes)."
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "PyYAML>=6"]

[tool.setuptools.packages.find]
include = ["refactory_dsh*"]

[tool.setuptools]
py-modules = []
