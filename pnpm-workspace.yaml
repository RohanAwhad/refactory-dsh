# The six packages this fork owns. The harness itself is the published
# @deepseek-ai/dsh pin the root manifest declares, not a workspace copy.
packages:
  - packages/workflow/workflow-spine
  - packages/bundle/graph
  - packages/refactory/refactory-console
  - packages/refactory/tool-refactory
  - packages/client/ui-refactory
  - packages/client/ui-brand-refactory

# A workspace package keeps its name against the registry copy of the same name.
linkWorkspacePackages: true

# Every cordis/schemastery name the pinned harness depends on, at the exact
# version its own installed tree carries. pnpm 11 reads settings from this file;
# the root manifest repeats the same table for readers.
overrides:
  '@deepseek-ai/cordis': '4.0.2'
  '@deepseek-ai/cordis-plugin-loader': '1.0.3'
  '@deepseek-ai/cordis-plugin-include': '1.0.7'
  '@deepseek-ai/cordis-plugin-hmr': '1.0.17'
  '@deepseek-ai/cordis-plugin-timer': '1.1.4'
  '@deepseek-ai/cordis-plugin-group': '1.0.2'
  '@deepseek-ai/schemastery': '3.18.2'

peerDependencyRules:
  allowedVersions:
    typescript: '>=5 <7'

# pnpm 10+ blocks any dependency shipping an install/build script until it is
# explicitly reviewed here (strictDepBuilds defaults to true: an unlisted script
# is a hard install error). Deny by default; allow only what the pin needs to run.
allowBuilds:
  esbuild: true
  lefthook: true
  # Persistent terminal sessions: node-pty builds its native binding at install.
  node-pty: true
  # The Python runtime deploy's reviewed postinstall restores the executable bit
  # on node-pty's macOS spawn helper.
  '@deepseek-ai/dsh-subprocess-local': true
  # JSONL durability calls MoveFileExW with write-through publication on Windows.
  koffi: true
  # No-ops we do not need; listed so the review is explicit rather than absent.
  '@google/genai': false
  protobufjs: false
  msgpackr-extract: false

patchedDependencies:
  '@deepseek-ai/dsh-client-ui-directory-picker-native@0.1.5-rc.3': patches/@deepseek-ai__dsh-client-ui-directory-picker-native@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-agent-presets@0.1.5-rc.3': patches/@deepseek-ai__dsh-agent-presets@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-headless@0.1.5-rc.3': patches/@deepseek-ai__dsh-headless@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-web-app@0.1.5-rc.3': patches/@deepseek-ai__dsh-web-app@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-goal-round-driver@0.1.5-rc.3': patches/@deepseek-ai__dsh-goal-round-driver@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-client-ui-conversation@0.1.5-rc.3': patches/@deepseek-ai__dsh-client-ui-conversation@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-subagent-codex@0.1.5-rc.3': patches/@deepseek-ai__dsh-subagent-codex@0.1.5-rc.3.patch
  '@deepseek-ai/dsh-subagent-claude-code@0.1.5-rc.3': patches/@deepseek-ai__dsh-subagent-claude-code@0.1.5-rc.3.patch
