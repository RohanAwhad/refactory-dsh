# The dsh-graph bundle patch: drives one CEO Agent over a refactory mode graph.
#
# `science` names a *package of modes* in refactory (SRF), not a runtime, so this
# profile is named for what it does rather than for what the first modes happened
# to be about.
# It stacks over dsh-base (which supplies shell, subagent, tools, and the LLM
# providers), adds the command-line provider and the workflow spine, and mounts
# the runner that drives one CEO Agent to quiescence.
#
# The spine row reads its graph, work directory, and command environment from
# the `graphStartup` service, so `--mode/--task/--budget` select the run.
# (The service keeps its name: it is an internal id, not a runtime.)

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are the CEO of an interactive scientific-research workflow, powered by the {{model}} model.

# Advancing a stateful workflow uses identical arguments by design. Keep the
# reminder for other tools; argument repetition is not workflow progress evidence.
- id: repeat-tool-reminder
  config:
    exclude: [wf_next]

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# A node's work happens in a subagent the CEO waits for. The base profile defaults
# subagents to background-and-continuable, which is right for an agent that wants to
# fan out and collect later — and wrong here: a CEO that backgrounds a node and
# finishes its turn abandons the graph, and the run ends with a cursor still due.
# Foreground-only is the enforcement; the spine's prompt asks, and this is what makes
# asking unnecessary.
#
# Both delegation rows carry the `ceo` preset's allow-list, so a subagent here also
# gets the content tools and no shell; the refactory bundle's `presets/ceo.patch.yml`
# says what is kept and why. A `tools/pre-execute` listener in the spine confines
# subagent `write` and `edit` to the run directory (config.workdir). The fork row
# comes from dsh-base, and a patch replaces a row's whole `config`, so it restates
# the base row's provider, name and mode as they were; like the base row it still
# offers `run_in_background`. Its child's tool list now differs from the CEO's, so a
# fork no longer reuses the CEO's cached request prefix.
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false
    toolFilter:
      allow: [read, write, edit, glob, grep, read_image, web_search, web_fetch, skill, todo_write, send_message]

- id: tool-subagent-fork
  config:
    provider: fork
    toolName: subagent_fork
    backgroundMode: one-shot
    toolFilter:
      allow: [read, write, edit, glob, grep, read_image, web_search, web_fetch, skill, todo_write, send_message]

- insert:
    - id: graph-startup
      name: '@deepseek-ai/dsh-graph/startup'

    # A host row, unlike the GUI's preset row: its `wf_*` tools, its prompt and its
    # `ceoDeny` guard reach every top-level agent on this host, which here is the one
    # CEO the runner boots. Subagents are out of the guard's reach; the delegation
    # rows above filter them.
    - id: workflow-spine
      name: '@deepseek-ai/dsh-workflow-spine'
      inject: [graphStartup]
      config:
        graph: !!js ctx.graphStartup.graph
        toolPrefix: wf
        maxIterations: 500
        executeCommands: true
        workdir: !!js ctx.graphStartup.workdir
        commandEnv: !!js ctx.graphStartup.commandEnv
        dataCommand: !!js ctx.graphStartup.dataCommand
        agentCommand: !!js ctx.graphStartup.agentCommand
        gateCommand: !!js ctx.graphStartup.gateCommand
        steerCommand: !!js ctx.graphStartup.pythonBin + '/python'
        steerArgs: ['-m', 'refactory_dsh.console', 'steer', '--run']
        commandTimeoutMs: 3600000
        ceoDeny:
          - bash
          - pwsh
          - write
          - edit
          - str_replace_editor
          - web_search
          - web_fetch
          - skill
          - ralph
          - workflow
          - read_image

    - id: graph-answerer
      name: '@deepseek-ai/dsh-graph/answerer'
      inject: [graphStartup]

    - id: graph-runner
      name: '@deepseek-ai/dsh-graph'
      inject: [graphStartup]
