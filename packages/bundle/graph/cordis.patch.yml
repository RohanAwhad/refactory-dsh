# The dsh-graph bundle patch: drives one CEO Agent over a refactory mode graph.
#
# `science` names a *package of modes* in refactory (SRF), not a runtime, so this
# profile is named for what it does rather than for what the first modes happened
# to be about.
# It stacks over dsh-base (which supplies shell, subagent, tools, and the LLM
# providers), adds the command-line provider and the workflow spine, and mounts
# the runner that drives one CEO Agent to quiescence.
#
# The spine row reads its graph, work directory, and command environment from
# the `graphStartup` service, so `--mode/--task/--budget` select the run.
# (The service keeps its name: it is an internal id, not a runtime.)

- id: system-prompt
  config:
    personaSuffix: Your working directory is {{cwd}}.
    personaPrefix: >-
      You are the CEO of an interactive scientific-research workflow, powered by the {{model}} model.

- id: tools
  config:
    mode: !!js process.env.DSH_TOOLS_MODE

# A node's work happens in a subagent the CEO waits for. The base profile defaults
# subagents to background-and-continuable, which is right for an agent that wants to
# fan out and collect later — and wrong here: a CEO that backgrounds a node and
# finishes its turn abandons the graph, and the run ends with a cursor still due.
# Foreground-only is the enforcement; the spine's prompt asks, and this is what makes
# asking unnecessary.
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: one-shot
    enableRunInBackground: false

- insert:
    - id: code-runtime
      name: '@deepseek-ai/dsh-code-runtime-worker-thread'

    - id: graph-startup
      name: '@deepseek-ai/dsh-graph/startup'

    - id: workflow-spine
      name: '@deepseek-ai/dsh-workflow-spine'
      inject: [graphStartup]
      config:
        graph: !!js ctx.graphStartup.graph
        toolPrefix: wf
        maxIterations: 500
        executeCommands: true
        workdir: !!js ctx.graphStartup.workdir
        commandEnv: !!js ctx.graphStartup.commandEnv
        dataCommand: !!js ctx.graphStartup.dataCommand
        steerCommand: !!js ctx.graphStartup.pythonBin + '/python'
        steerArgs: ['-m', 'refactory_dsh.console', 'steer', '--run']
        commandTimeoutMs: 3600000
        ceoDeny:
          - bash
          - pwsh
          - write
          - edit
          - str_replace_editor
          - web_search
          - web_fetch
          - skill
          - ralph
          - workflow
          - read_image

    - id: graph-answerer
      name: '@deepseek-ai/dsh-graph/answerer'
      inject: [graphStartup]

    - id: graph-runner
      name: '@deepseek-ai/dsh-graph'
      inject: [graphStartup]
