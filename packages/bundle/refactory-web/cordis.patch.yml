# The refactory web bundle patch: the browser surface's refactory occupants over
# the `dsh-web-app` layer.
#
# This layer replaces the pnpm patch that used to edit `@deepseek-ai/dsh-web-app`
# itself. The client-module system discovers a browser plugin by scanning the
# already-mounted Loader entries for packages declaring `dsh.client`, so a plugin
# only has to be an active entry with a `./client` bundle — the upstream manifest
# does not have to list it. An ordinary bundle patch can therefore contribute the
# same rows without rewriting an upstream package.
#
# Layer order is a precondition: a patch only reaches a row an earlier layer
# created, and the `insert` below appends rows this layer owns. `dsh plugin add`
# appends a newly installed bundle after the profile's template bundles, so an
# ordinary profile install applies this after `@deepseek-ai/dsh-web-app`; a
# hand-edited bundle list must keep it after. The append follows the order the
# adds run in, not a dependency order: `pnpm add` writes the profile manifest's
# `dependencies` keys alphabetically and the harness reconciles bundles by
# iterating those keys, so declaring a dependency on `@deepseek-ai/dsh-web-app`
# would land this layer before the layer it patches.
#
# `agent-preset-registry` is deliberately NOT stated here. That row's `config` is
# replaced wholesale rather than merged, and `@deepseek-ai/dsh-refactory`
# is its single owner — it sets `default: ceo`. A second `config` from this layer
# would silently drop that default and let the harness's own win.

# Advancing a stateful workflow uses identical arguments by design. Keep the
# reminder for other tools; argument repetition is not workflow progress evidence.
- id: repeat-tool-reminder
  config:
    exclude: [wf_next, wf_verdict]

# H1: Default the Enter-behaviour to steer so mid-turn messages from the person
# are delivered as steering rather than queued.  DSH settings resolve
# "schema defaults → composition base → user layer" (dsh-settings types.d.ts),
# so this composition base is overridden by a person's saved choice.
- id: ui-conversation
  config:
    busyEnter: steer

# The re:factory brand replaces the official DeepSeek whale.
- id: ui-brand-official
  disabled: true

# The dsh-web-app layer always mounts `client-hmr` (@deepseek-ai/dsh-client-hmr).
# Its host half stat-polls every client bundle every 500 ms and treats a
# ctime-only change as a rebuild; any `pnpm install` on the machine causes one
# by hard-linking the same store files.  The hot swap then blanks the page with
# SlotAssemblyError.  A developer running a rebuild watcher turns it back on
# with a profile user-layer row `disabled: false` (README "Turn live reload
# back on").
- id: client-hmr
  disabled: true

- insert:
    # Publishes the checkout root the `refactory-console` row reads. A patch
    # cannot compute its own package directory: `!!js` is evaluated as
    # `new Function('ctx', 'expr', ...)`, so it has no `import.meta`. This plugin
    # has one, so it resolves the checkout from its own location and hands the
    # path over. `process.cwd()` would name the *user's* working directory.
    - id: refactory-web-startup
      name: '@deepseek-ai/dsh-refactory-web/startup'

    # The refactory console over Typert Remote: the same process boundary the
    # model-facing tool uses, so the Web picker and the model read one JSON.
    # `inject` orders the startup provider before this reader.
    - id: refactory-console
      name: '@deepseek-ai/dsh-refactory-console'
      inject: [refactoryWebStartup]
      config:
        repoRoot: !!js ctx.refactoryWebStartup.repoRoot

    # The interactive workflow spine is NOT mounted here. It lives in the `ceo`
    # preset (`packages/bundle/refactory/presets/ceo.patch.yml`) so its tools and
    # its deny-guard reach that preset's agents only: a host row would reach every
    # top-level agent on the host, whatever preset its session uses. That bundle is
    # applied after this layer.

    # The right Sidebar's refactory picker: the console's described choices,
    # started and read through the refactoryConsole endpoint.
    - id: ui-refactory
      name: '@deepseek-ai/dsh-client-ui-refactory'

    # re:factory occupants for the generic brand slots.
    - id: ui-brand-refactory
      name: '@deepseek-ai/dsh-client-ui-brand-refactory'
