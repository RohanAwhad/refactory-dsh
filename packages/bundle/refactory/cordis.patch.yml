# The refactory agent-preset bundle patch: makes the `ceo` preset declared in
# `presets/ceo.patch.yml` the deployment default for a profile that carries this
# bundle.
#
# `agent-preset-registry` REPLACES a row's whole `config` object rather than
# merging it, so this patch restates `default` — the schema requires it, and
# omitting it fails the mount. `selectedDefault` is deliberately not stated: it
# is the volatile field a person's Settings write owns, and a patch must not pin
# it. The registry takes no configured `roots` at this pin: each preset is its
# own `@deepseek-ai/dsh-agent-preset` declaration, so `ceo` arrives the way the
# harness's own `standard` does rather than through a discovered preset tree.
#
# That replacement rule makes this row's `config` SINGLE-OWNER: a layer applied
# after this one that patches the same `id` without repeating `default` drops
# this bundle's default entirely, and the only symptom is the harness's own
# default winning with no diagnostic. Which layer is last follows
# `dsh.profile.bundles` order, so any second patcher of `agent-preset-registry`
# is a conflict, not a merge. The `dsh-web-app` layer owns the row's other keys
# and must not state `agent-preset-registry` at all once this bundle supplies it.
#
# The `agent-preset-registry` row is inserted by the `dsh-web-app` layer, and a
# patch only reaches a row an earlier layer created — one that matches nothing
# warns and is skipped. So this bundle must be applied AFTER
# `@deepseek-ai/dsh-web-app` in `dsh.profile.bundles`. `dsh plugin add` appends a
# newly installed bundle after the bundles already listed, and the template's are
# already there, so an ordinary install satisfies that as long as the adds run in
# layer order; `dsh_profile`'s plan does. Declaring `@deepseek-ai/dsh-web-app` as
# a dependency of this bundle does NOT: `pnpm add` writes a profile manifest's
# `dependencies` keys in alphabetical order, the harness appends new bundles by
# iterating those keys, and `dsh-refactory` sorts before `dsh-web-app` — so this
# patch would match no row. A hand-edited bundle list must keep
# `@deepseek-ai/dsh-refactory` after `@deepseek-ai/dsh-web-app`.

- id: agent-preset-registry
  config:
    default: ceo
