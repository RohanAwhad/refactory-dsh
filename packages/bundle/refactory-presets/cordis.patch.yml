# The refactory agent-preset bundle patch: ships the `ceo` preset from this
# package's own `presets/` tree through the `agent-presets` roster's configured
# roots, instead of patching `@deepseek-ai/dsh-agent-presets` to carry it.
#
# `agent-presets` REPLACES a row's whole `config` object rather than merging it,
# so this patch restates `default` — the schema requires it, and omitting it
# fails the mount. `includeShippedRoot` and `includeUserRoot` keep their `true`
# defaults, so the shipped presets and the harness-home user presets stay
# mounted exactly as before.
#
# The `!!js` expression names the startup service below rather than computing a
# path: a patch is evaluated as `new Function('ctx', 'expr', ...)`, so it has no
# `import.meta` and cannot find its own package directory. The startup plugin
# can, so it publishes the resolved root for this row to read.
#
# The `agent-presets` row is inserted by the `dsh-web-app` layer, and a patch only
# reaches a row an earlier layer created — one that matches nothing warns and is
# skipped. So this bundle must be applied AFTER `@deepseek-ai/dsh-web-app` in
# `dsh.profile.bundles`. `dsh plugin add` reconciles the list in dependency order,
# so a profile install satisfies that automatically; a profile whose bundle list
# was hand-edited must keep `@deepseek-ai/dsh-refactory-presets` after it.

- insert:
    - id: refactory-presets-startup
      name: '@deepseek-ai/dsh-refactory-presets/startup'

- id: agent-presets
  inject: [refactoryPresetsStartup]
  config:
    default: ceo
    roots:
      - path: !!js ctx.refactoryPresetsStartup.presetRoot
        trust: system
