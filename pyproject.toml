# The Python project for this checkout, so `uv sync` and `uv run refactory` work
# from the repository root — one command to install, one command to use.
#
# The packages are local: `refactory/` is the glue (the modes, the loop, the console)
# and it owns the workflow IR it lowers into. They are editable, so the source you
# are reading is the source that runs.
[project]
name = "refactory-dsh-root"
version = "0.1.0"
description = "Create a mode, use it, optimize it, use it again — from one command."
requires-python = ">=3.11"  # what the glue declares; uv manages the interpreter
dependencies = ["refactory-dsh"]

[tool.uv.sources]
refactory-dsh = { path = "refactory", editable = true }
# The reference graph language, used only by the tests as an oracle. It stays out
# of `dependencies` because its own pyproject pulls in fastapi, uvicorn, mcp,
# langfuse, anthropic[vertex] and more; the shipping install must not pay for them.
remote-factory = { git = "https://github.com/akashgit/remote-factory.git", rev = "e7eb24906a8ddcecd341c577bd669579ee31a21c" }

[dependency-groups]
# What the test suite needs. `uv sync` installs these by default, so a clone can run
# the tests without a second install step — the suite is part of the product here.
dev = ["pytest>=8", "sympy>=1.12"]
# The oracle group is not installed by default: `uv sync --group reference` adds it,
# and the parity tests skip with a reason on a machine that does not have it.
reference = ["remote-factory"]

[tool.uv]
package = false
