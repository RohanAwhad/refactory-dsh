# The Python project for this checkout, so `uv sync` and `uv run refactory` work
# from the repository root — one command to install, one command to use.
#
# The three packages are local: `refactory/` is the glue (the modes, the loop, the
# console), and the two submodules are the language (`factory`) and the reference
# package of science modes (`srf`). They are editable, so the source you are reading
# is the source that runs.
[project]
name = "refactory-dsh-root"
version = "0.1.0"
description = "Create a mode, use it, optimize it, use it again — from one command."
requires-python = ">=3.12"  # the vendored srf needs 3.12; uv manages the interpreter
dependencies = [
  "refactory-dsh",
  "remote-factory",
  "srf",
]

[tool.uv.sources]
refactory-dsh = { path = "refactory", editable = true }
remote-factory = { path = "refactory/vendor/remote-factory", editable = true }
srf = { path = "refactory/vendor/srf", editable = true }

[dependency-groups]
# What the test suite needs. `uv sync` installs these by default, so a clone can run
# the tests without a second install step — the suite is part of the product here.
dev = ["pytest>=8", "sympy>=1.12"]

[tool.uv]
package = false
